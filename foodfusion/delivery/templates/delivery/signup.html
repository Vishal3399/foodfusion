{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFusion | Create account</title>
    <link rel="stylesheet" href="{% static 'delivery/css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container navbar">
            <div class="brand">
                <span class="brand-mark">F</span>
                <span>FoodFusion</span>
            </div>
            <nav class="nav-links">
                <a href="{% url 'index' %}">Home</a>
                <a href="{% url 'open_login' %}">Login</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        <div class="container">
            <div class="form-panel">
                <div class="form-header">
                    <h1>Create your account</h1>
                    <p>Join FoodFusion and start exploring delicious meals.</p>
                </div>

                <form action="{% url 'signup' %}" method="post" class="form-grid">
                    {% csrf_token %}

                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter a username" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a secure password" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="field">
                        <label for="mobile">Mobile</label>
                        <input type="text" id="mobile" name="mobile" placeholder="Your phone number" required>
                    </div>

                    <div class="field">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" placeholder="Tell us where to deliver" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Create account</button>
                        <a href="{% url 'open_login' %}" class="muted-link">Already have an account?</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
